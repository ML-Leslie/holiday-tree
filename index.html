<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>Merry Christmas · 3D 粒子手势圣诞树</title>

  <!-- Google Fonts with graceful Script fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Three.js Primary Import Map (Fastly jsDelivr — China & Global friendly) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://fastly.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://fastly.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif;
      color: #fff;
    }

    /* Midnight Starry Background */
    #bg-xmas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, #091530 0%, #040814 58%, #000000 100%);
    }

    /* Main WebGL Canvas */
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      touch-action: none;
    }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Top Centered Glowing Title — Respects iPhone Dynamic Island / Notch */
    .title-stage {
      position: fixed;
      top: calc(var(--safe-top) + 14px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      text-align: center;
      width: 92%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #title-xmas {
      font-family: 'Great Vibes', 'Snell Roundhand', 'Brush Script MT', cursive;
      font-size: clamp(2.35rem, 9.5vw, 4.4rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      white-space: nowrap;
      background: linear-gradient(180deg, #fff9e6 0%, #ffd97d 48%, #d4942a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: blur(8px) drop-shadow(0 0 12px rgba(255, 212, 110, 0.65))
              drop-shadow(0 0 28px rgba(255, 180, 60, 0.35));
      opacity: 0;
      transform: translateY(14px) scale(0.94);
      transition: opacity 1.5s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.5s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #title-xmas.revealed {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: drop-shadow(0 0 12px rgba(255, 212, 110, 0.65))
              drop-shadow(0 0 28px rgba(255, 180, 60, 0.35));
    }

    /* Intro Gift Overlay (Stage C: Tap to Open) */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 50% 48%, rgba(18, 28, 56, 0.36) 0%, rgba(2, 4, 12, 0.72) 100%);
      cursor: pointer;
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #intro-overlay.dismissed {
      opacity: 0;
      transform: scale(1.12);
      pointer-events: none;
    }

    .gift-stage {
      position: relative;
      width: 210px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: giftFloat 3.4s ease-in-out infinite;
    }

    .gift-halo {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 214, 110, 0.34) 0%, rgba(255, 160, 70, 0.10) 50%, rgba(0, 0, 0, 0) 74%);
      animation: haloPulse 2.8s ease-in-out infinite;
      pointer-events: none;
    }

    #gift-particle-canvas {
      position: relative;
      width: 210px;
      height: 210px;
      display: block;
    }

    .intro-sub {
      font-family: 'Great Vibes', 'Snell Roundhand', cursive;
      font-size: clamp(1.85rem, 7vw, 2.5rem);
      background: linear-gradient(180deg, #fff9e6 0%, #ffd97d 60%, #d4942a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(255, 212, 110, 0.55));
      letter-spacing: 0.03em;
    }

    .intro-cta {
      padding: 11px 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 224, 145, 0.52);
      background: rgba(255, 214, 110, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff4d2;
      font-size: 14px;
      letter-spacing: 0.12em;
      box-shadow: 0 0 24px rgba(255, 200, 90, 0.24);
      animation: ctaGlow 2.4s ease-in-out infinite;
    }

    @keyframes giftFloat {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }

    @keyframes haloPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.72; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    @keyframes ctaGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(255, 200, 90, 0.22); }
      50% { box-shadow: 0 0 30px rgba(255, 216, 120, 0.48); }
    }

    /* Subtle Gesture / Action Feedback Toast */
    #gesture-toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 150px);
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      z-index: 25;
      pointer-events: none;
      max-width: 88vw;
      text-align: center;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(12, 14, 24, 0.68);
      border: 1px solid rgba(255, 220, 140, 0.32);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #ffefc8;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
    }

    #gesture-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Polaroid Quick Navigation Bar (Shown only when a Polaroid is focused) */
    #polaroid-nav {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 90px);
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(12, 14, 24, 0.72);
      border: 1px solid rgba(255, 224, 150, 0.34);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #polaroid-nav.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .pnav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.1);
      color: #ffefc8;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .pnav-btn:active {
      transform: scale(0.92);
      background: rgba(255, 214, 110, 0.3);
    }

    #polaroid-counter {
      font-size: 12px;
      color: #ffe8a8;
      min-width: 42px;
      text-align: center;
    }

    /* Compact Mobile-Friendly Camera & Hand Skeleton Preview */
    #camera-preview-wrap {
      position: fixed;
      left: calc(var(--safe-left) + 14px);
      top: calc(var(--safe-top) + 88px);
      z-index: 24;
      width: 112px;
      height: 148px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(8, 10, 18, 0.76);
      border: 1px solid rgba(255, 224, 150, 0.32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #camera-preview-wrap.visible {
      opacity: 0.94;
      transform: scale(1);
      pointer-events: auto;
    }

    #webcam-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.58;
    }

    #hand-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    #camera-status-badge {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      padding: 3px 6px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 9.5px;
      color: #ffd97d;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      flex-shrink: 0;
    }

    .cam-mini-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 4;
      display: flex;
      gap: 5px;
    }

    .cam-mini-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(10, 12, 20, 0.68);
      color: #ffefc8;
      font-size: 12px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cam-mini-btn:active {
      transform: scale(0.9);
      background: rgba(255, 100, 100, 0.45);
    }

    /* Bottom-Center Thumb-Friendly Control Dock (iPhone & Desktop Adaptive) */
    .control-dock-zone {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 16px);
      transform: translateX(-50%) translateY(16px);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100vw - 24px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .control-dock-zone.revealed {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .control-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(14, 16, 28, 0.64);
      border: 1px solid rgba(255, 224, 150, 0.24);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.52);
      pointer-events: auto;
    }

    .ctrl-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #f6e7c1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.22s ease, border-color 0.22s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
      background: rgba(255, 214, 110, 0.28);
    }

    .ctrl-btn.active {
      background: rgba(255, 198, 70, 0.28);
      border-color: rgba(255, 214, 110, 0.78);
      color: #fff3c4;
      box-shadow: 0 0 14px rgba(255, 198, 70, 0.28);
    }

    .ctrl-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Desktop hover refinement */
    @media (hover: hover) and (pointer: fine) {
      .control-dock-zone {
        left: auto;
        right: 22px;
        transform: translateY(16px);
        align-items: flex-end;
      }
      .control-dock-zone.revealed {
        transform: translateY(0);
      }
      .control-bar {
        opacity: 0.32;
        transition: opacity 0.3s ease;
      }
      .control-dock-zone:hover .control-bar,
      .control-bar.pinned {
        opacity: 1;
      }
      .ctrl-btn:hover {
        background: rgba(255, 214, 110, 0.22);
        border-color: rgba(255, 214, 110, 0.6);
        transform: translateY(-2px);
      }
      .ctrl-btn::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%) translateY(4px);
        padding: 5px 10px;
        border-radius: 8px;
        background: rgba(10, 12, 20, 0.9);
        border: 1px solid rgba(255, 224, 150, 0.24);
        color: #ffefc8;
        font-size: 11px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .ctrl-btn:hover::after {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #camera-preview-wrap {
        top: auto;
        bottom: 22px;
        left: 22px;
        width: 196px;
        height: 148px;
      }
    }

    /* Gesture & Touch Guide Sheet */
    #gesture-guide {
      width: min(310px, calc(100vw - 32px));
      padding: 15px 16px;
      border-radius: 18px;
      background: rgba(10, 12, 22, 0.88);
      border: 1px solid rgba(255, 220, 140, 0.28);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
      font-size: 12px;
      line-height: 1.6;
      color: #e8e2d2;
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #gesture-guide.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #gesture-guide h4 {
      font-size: 13px;
      font-weight: 500;
      color: #ffd97d;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .guide-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 5px;
    }

    .guide-icon {
      width: 20px;
      text-align: center;
      flex-shrink: 0;
      font-size: 13px;
    }

    .guide-text b {
      color: #fff4d2;
      font-weight: 500;
    }

    .guide-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 8px 0;
    }

    .guide-keys {
      font-size: 11px;
      color: rgba(255, 238, 200, 0.78);
    }

    .guide-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      color: rgba(255, 238, 200, 0.72);
    }

    #btn-reset-photos {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 214, 110, 0.38);
      background: rgba(255, 214, 110, 0.12);
      color: #ffe8a3;
      font-size: 11px;
      cursor: pointer;
    }

    #btn-reset-photos:active {
      transform: scale(0.94);
      background: rgba(255, 214, 110, 0.28);
    }

    #photo-upload-input {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Starry Background -->
  <div id="bg-xmas"></div>

  <!-- 3D Scene Container -->
  <div id="canvas-container"></div>

  <!-- Intro Tap-to-Open Particle Gift Overlay -->
  <div id="intro-overlay" role="button" aria-label="轻触点亮圣诞树">
    <div class="gift-stage">
      <div class="gift-halo"></div>
      <canvas id="gift-particle-canvas"></canvas>
    </div>
    <div class="intro-sub">A Christmas Gift For You</div>
    <div class="intro-cta">✨ 轻触点亮圣诞树</div>
  </div>

  <!-- Centered Glowing Title -->
  <div class="title-stage">
    <h1 id="title-xmas">Merry Christmas</h1>
  </div>

  <!-- Feedback Toast -->
  <div id="gesture-toast"></div>

  <!-- Polaroid Quick Controls (Mobile Friendly) -->
  <div id="polaroid-nav">
    <button class="pnav-btn" id="btn-prev-photo" aria-label="上一张">‹</button>
    <span id="polaroid-counter">1 / 25</span>
    <button class="pnav-btn" id="btn-next-photo" aria-label="下一张">›</button>
    <button class="pnav-btn" id="btn-close-photo" aria-label="收起照片">✕</button>
  </div>

  <!-- Camera & Hand Skeleton Preview -->
  <div id="camera-preview-wrap">
    <video id="webcam-video" autoplay playsinline webkit-playsinline muted></video>
    <canvas id="hand-canvas" width="160" height="210"></canvas>
    <div class="cam-mini-actions">
      <button class="cam-mini-btn" id="btn-cam-hide" type="button" aria-label="隐藏预览" title="隐藏预览">–</button>
      <button class="cam-mini-btn" id="btn-cam-close" type="button" aria-label="关闭摄像头" title="关闭摄像头">✕</button>
    </div>
    <div id="camera-status-badge">
      <span class="status-dot"></span>
      <span id="gesture-label">手势追踪中</span>
    </div>
  </div>

  <!-- Bottom Adaptive Control Dock -->
  <div class="control-dock-zone">
    <div id="gesture-guide">
      <h4>
        <span>触控 & 隔空手势指南</span>
      </h4>
      <div class="guide-row">
        <span class="guide-icon">🖐️</span>
        <span class="guide-text"><b>张开手掌 / 双指放大 / 双击</b>：粒子炸裂散开为星河</span>
      </div>
      <div class="guide-row">
        <span class="guide-icon">✊</span>
        <span class="guide-text"><b>握紧拳头 / 双指缩小</b>：螺旋引力聚拢重塑圣诞树</span>
      </div>
      <div class="guide-row">
        <span class="guide-icon">👋</span>
        <span class="guide-text"><b>移动手掌 / 单指滑动</b>：旋转 3D 视角与视差</span>
      </div>
      <div class="guide-row">
        <span class="guide-icon">🤏</span>
        <span class="guide-text"><b>捏合抓取 / 散开后单击屏幕</b>：浮现拍立得并切换照片</span>
      </div>
      <div class="guide-divider"></div>
      <div class="guide-keys">
        iPhone 触控：单指旋转 · 双指缩放（放大自动散开）· 散开后单击浮现拍立得 · 再次点击 📷 可关闭摄像头
      </div>
      <div class="guide-actions">
        <span id="saved-photo-status">本地已保存 0 / 25 张</span>
        <button id="btn-reset-photos" type="button">恢复默认照片</button>
      </div>
    </div>

    <div class="control-bar" id="control-bar">
      <input type="file" id="photo-upload-input" accept="image/*" multiple />

      <button class="ctrl-btn" id="btn-scatter" data-tip="散开 / 聚拢星云 (Space)">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><circle cx="19" cy="19" r="1.5"/><circle cx="5" cy="18" r="1.2"/></svg>
      </button>

      <button class="ctrl-btn" id="btn-photo" data-tip="抓出 / 切换拍立得 (P)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>

      <button class="ctrl-btn" id="btn-upload" data-tip="从相册上传照片">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>

      <button class="ctrl-btn" id="btn-camera" data-tip="开启 / 关闭手势摄像头 (C)">
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>

      <button class="ctrl-btn active" id="btn-audio" data-tip="开启 / 静音圣诞八音盒 (M)">
        <svg id="icon-audio-on" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <svg id="icon-audio-off" viewBox="0 0 24 24" style="display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      </button>

      <button class="ctrl-btn" id="btn-guide" data-tip="操作与手势说明">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
    </div>
  </div>

  <script type="module">
    /* =========================================================================
       0. MULTI-CDN AUTO-FALLBACK LOADER (THREE.JS + MEDIAPIPE HANDS)
       ========================================================================= */
    const toastEl = document.getElementById('gesture-toast');
    let toastTimer = null;
    function showToast(msg, duration = 2400) {
      toastEl.textContent = msg;
      toastEl.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('visible'), duration);
    }

    async function loadThreeModules() {
      // Try importmap first (Fastly jsDelivr), then auto-fallback to esm.sh & jsDelivr +esm
      try {
        const [THREE, { EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }, { RoomEnvironment }] =
          await Promise.all([
            import('three'),
            import('three/addons/postprocessing/EffectComposer.js'),
            import('three/addons/postprocessing/RenderPass.js'),
            import('three/addons/postprocessing/UnrealBloomPass.js'),
            import('three/addons/postprocessing/OutputPass.js'),
            import('three/addons/environments/RoomEnvironment.js'),
          ]);
        return { THREE, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment };
      } catch (primaryErr) {
        const fallbackBases = [
          'https://esm.sh/three@0.169.0',
          'https://cdn.jsdelivr.net/npm/three@0.169.0',
        ];
        for (const base of fallbackBases) {
          try {
            const isEsmSh = base.includes('esm.sh');
            const suffix = isEsmSh ? '' : '/+esm';
            const [THREE, { EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }, { RoomEnvironment }] =
              await Promise.all([
                import(`${base}${suffix}`),
                import(`${base}/examples/jsm/postprocessing/EffectComposer.js${suffix}`),
                import(`${base}/examples/jsm/postprocessing/RenderPass.js${suffix}`),
                import(`${base}/examples/jsm/postprocessing/UnrealBloomPass.js${suffix}`),
                import(`${base}/examples/jsm/postprocessing/OutputPass.js${suffix}`),
                import(`${base}/examples/jsm/environments/RoomEnvironment.js${suffix}`),
              ]);
            return { THREE, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment };
          } catch (_) {
            // Try next CDN
          }
        }
        showToast('⚠️ 3D 引擎 CDN 加载失败，请检查网络连接后刷新', 6000);
        throw primaryErr;
      }
    }

    // Multi-CDN Fallback for MediaPipe Hands (pinned version for fast cache hit)
    const MEDIAPIPE_CDNS = [
      'https://fastly.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/',
      'https://gcore.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/',
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/',
      'https://unpkg.com/@mediapipe/hands@0.4.1675469240/',
      'https://npm.elemecdn.com/@mediapipe/hands@0.4.1675469240/',
    ];

    let activeMediaPipeCdn = null;
    let mediaPipeLoadPromise = null;

    function loadScriptWithTimeout(url, timeoutMs = 6500) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.crossOrigin = 'anonymous';
        script.async = true;

        const timer = setTimeout(() => {
          script.remove();
          reject(new Error('timeout'));
        }, timeoutMs);

        script.onload = () => {
          clearTimeout(timer);
          resolve();
        };
        script.onerror = () => {
          clearTimeout(timer);
          script.remove();
          reject(new Error('load error'));
        };
        document.head.appendChild(script);
      });
    }

    async function ensureMediaPipeLoaded() {
      if (typeof window.Hands !== 'undefined' && activeMediaPipeCdn) {
        return activeMediaPipeCdn;
      }
      if (mediaPipeLoadPromise) return mediaPipeLoadPromise;

      mediaPipeLoadPromise = (async () => {
        for (let i = 0; i < MEDIAPIPE_CDNS.length; i++) {
          const base = MEDIAPIPE_CDNS[i];
          try {
            await loadScriptWithTimeout(`${base}hands.js`, 6500);
            if (typeof window.Hands !== 'undefined') {
              activeMediaPipeCdn = base;
              return base;
            }
          } catch (_) {
            // Silently switch to next mirror
          }
        }
        mediaPipeLoadPromise = null; // allow retry on next tap
        throw new Error('All MediaPipe CDNs failed');
      })();

      return mediaPipeLoadPromise;
    }

    // Start preloading MediaPipe quietly in the background without blocking 3D scene
    ensureMediaPipeLoaded().catch(() => {});

    // Load Three.js modules and boot the experience
    const { THREE, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment } = await loadThreeModules();

    /* =========================================================================
       1. DEVICE & MOBILE (iPHONE) ADAPTIVE CONFIG + APP STATE
       ========================================================================= */
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 820;
    const isPortrait = () => window.innerHeight > window.innerWidth;

    function getDefaultCamDist() {
      return isPortrait() ? 27.5 : 21.5;
    }

    const state = {
      themeTarget: 0,
      themeCurrent: 0,
      scatterTarget: 0,
      scatterCurrent: 0,

      // Opening Sequence: 'WAIT' -> 'LIGHTING' -> 'DONE'
      introStage: 'WAIT',
      introStartTime: 0,
      introReveal: 0,

      camYawTarget: 0,
      camYaw: 0,
      camPitchTarget: 0.08,
      camPitch: 0.08,
      camDistTarget: getDefaultCamDist(),
      camDist: getDefaultCamDist(),
      parallaxXTarget: 0,
      parallaxYTarget: 0,
      parallaxX: 0,
      parallaxY: 0,

      autoSpinAngle: 0,
      isDragging: false,
      lastPointerX: 0,
      lastPointerY: 0,

      activePhotoIndex: -1,
      lastPhotoIndex: 0,
      photoCount: 25,

      cameraActive: false,
      previewVisible: false,
      handDetected: false,
      handNormX: 0.5,
      handNormY: 0.5,
      smoothedHandX: 0.5,
      smoothedHandY: 0.5,
      currentGesture: 'NONE',
      gestureStableFrames: 0,
      lastRawGesture: 'NONE',
      isPinching: false,
      pinchAnchorX: 0.5,
      pinchSwipeCooldown: 0,
      vHoldStart: 0,
      themeSwitchCooldown: 0,
      lastTwoHandDist: 1.0,
    };

    const clock = new THREE.Clock();

    /* =========================================================================
       2. THREE.JS RENDERER, SCENE, CAMERA & CINEMATIC BLOOM
       ========================================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      isPortrait() ? 52 : 46,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );
    camera.position.set(0, 1.2, state.camDist);

    const renderer = new THREE.WebGLRenderer({
      antialias: !isMobile, // Mobile Retina DPR handles edge smoothness cleanly
      alpha: true,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.75 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.96;
    container.appendChild(renderer.domElement);

    // Environment Map for glossy ornaments
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.65;

    // Post-Processing with Selective HDR UnrealBloomPass (crisp, zero whiteout)
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      isMobile ? 0.42 : 0.48,
      0.36,
      0.86
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.58);
    scene.add(ambientLight);

    const keyLight = new THREE.PointLight(0xffe4a0, 3.2, 48);
    keyLight.position.set(6, 10, 10);
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x55aaff, 2.0, 48);
    rimLight.position.set(-9, 4, -8);
    scene.add(rimLight);

    const innerTreeLight = new THREE.PointLight(0xffb84d, 3.5, 24);
    innerTreeLight.position.set(0, 1.2, 0);
    scene.add(innerTreeLight);

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    /* =========================================================================
       3. BACKGROUND STARDUST & FESTIVE EMBERS
       ========================================================================= */
    function createBackgroundStardust() {
      const count = isMobile ? 1100 : 2000;
      const positions = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      const sizes = new Float32Array(count);
      const speeds = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const r = 18 + Math.random() * 58;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

        phases[i] = Math.random() * Math.PI * 2;
        sizes[i] = (isMobile ? 0.9 : 0.6) + Math.random() * 2.2;
        speeds[i] = 0.4 + Math.random() * 1.4;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uTheme: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, isMobile ? 1.75 : 2) },
        },
        vertexShader: `
          attribute float aPhase;
          attribute float aSize;
          attribute float aSpeed;
          uniform float uTime;
          uniform float uTheme;
          uniform float uPixelRatio;
          varying float vAlpha;
          varying float vRand;

          void main() {
            vec3 pos = position;
            float driftY = mix(sin(uTime * 0.25 * aSpeed + aPhase) * 0.6, mod(uTime * 0.7 * aSpeed + aPhase * 8.0, 50.0) - 25.0, uTheme * 0.35);
            pos.y += driftY * 0.35;
            pos.x += cos(uTime * 0.18 * aSpeed + aPhase) * 0.45;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = aSize * uPixelRatio * (115.0 / -mvPosition.z);

            float twinkle = 0.45 + 0.55 * sin(uTime * 1.8 * aSpeed + aPhase * 6.0);
            vAlpha = twinkle * 0.85;
            vRand = fract(sin(aPhase * 123.45) * 43758.5453);
          }
        `,
        fragmentShader: `
          uniform float uTheme;
          varying float vAlpha;
          varying float vRand;

          void main() {
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            float glow = pow(1.0 - d * 2.0, 2.4);

            vec3 xmasCol = mix(vec3(0.88, 0.93, 1.0), vec3(1.0, 0.90, 0.68), vRand);
            vec3 cnyCol = mix(vec3(1.0, 0.78, 0.28), vec3(1.0, 0.28, 0.12), vRand * 0.65);

            vec3 col = mix(xmasCol, cnyCol, uTheme) * 1.45;
            gl_FragColor = vec4(col, glow * vAlpha);
          }
        `,
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);
      return { points, mat };
    }

    const bgStardust = createBackgroundStardust();

    /* =========================================================================
       4. MAIN 3D PARTICLE TREE (iPHONE 60 FPS OPTIMIZED)
       ========================================================================= */
    function createParticleTree() {
      const count = isMobile ? 9600 : 16500;
      const treePos = new Float32Array(count * 3);
      const scatterPos = new Float32Array(count * 3);
      const colorXmas = new Float32Array(count * 3);
      const colorCNY = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const phases = new Float32Array(count);
      const boost = new Float32Array(count);

      const xmasPinePalette = [
        new THREE.Color('#00d46a'),
        new THREE.Color('#0d8a55'),
        new THREE.Color('#19c9a8'),
        new THREE.Color('#15a362'),
      ];
      const xmasGoldPalette = [
        new THREE.Color('#ffd466'),
        new THREE.Color('#fff0bd'),
        new THREE.Color('#ffaa33'),
      ];
      const xmasJewelLights = [
        new THREE.Color('#ff3864'), // ruby fairy light
        new THREE.Color('#56cfe1'), // ice crystal blue
        new THREE.Color('#ff9ebb'), // rose gold
        new THREE.Color('#ffd166'), // warm gold
      ];

      const treeHeight = 13.0;
      const baseRadius = 5.15;

      for (let i = 0; i < count; i++) {
        const isGarland = i < count * 0.28;
        const isJewel = !isGarland && i < count * 0.37;
        let y, r, angle;

        if (isGarland) {
          const t = i / (count * 0.28);
          const strand = i % 3;
          y = -treeHeight * 0.5 + t * treeHeight;
          const coneR = baseRadius * Math.pow(1.0 - t, 0.94);
          r = coneR + 0.18 + (Math.random() - 0.5) * 0.2;
          angle = t * Math.PI * 14.0 + (strand * Math.PI * 2) / 3 + (Math.random() - 0.5) * 0.16;
        } else {
          const t = Math.pow(Math.random(), 0.78);
          y = -treeHeight * 0.5 + t * treeHeight;
          // Sculpted tiered pine boughs for a lush, layered Christmas tree silhouette
          const tierWave = 1.0 + 0.18 * Math.sin(t * Math.PI * 13.0);
          const maxR = baseRadius * Math.pow(1.0 - t, 0.92) * tierWave;
          const shellBias = isJewel ? (0.86 + Math.random() * 0.18) : (0.26 + 0.74 * Math.pow(Math.random(), 0.4));
          r = maxR * shellBias;
          angle = t * Math.PI * 18.0 + Math.random() * Math.PI * 2;
        }

        treePos[i * 3] = Math.cos(angle) * r;
        treePos[i * 3 + 1] = y;
        treePos[i * 3 + 2] = Math.sin(angle) * r;

        const sr = 6.5 + Math.pow(Math.random(), 0.75) * 19.5;
        const sTheta = Math.random() * Math.PI * 2;
        const sPhi = Math.acos(2 * Math.random() - 1);
        scatterPos[i * 3] = sr * Math.sin(sPhi) * Math.cos(sTheta);
        scatterPos[i * 3 + 1] = sr * Math.cos(sPhi) * 0.82;
        scatterPos[i * 3 + 2] = sr * Math.sin(sPhi) * Math.sin(sTheta);

        const xc = isGarland
          ? xmasGoldPalette[Math.floor(Math.random() * xmasGoldPalette.length)]
          : isJewel
            ? xmasJewelLights[Math.floor(Math.random() * xmasJewelLights.length)]
            : xmasPinePalette[Math.floor(Math.random() * xmasPinePalette.length)];
        colorXmas[i * 3] = xc.r;
        colorXmas[i * 3 + 1] = xc.g;
        colorXmas[i * 3 + 2] = xc.b;

        colorCNY[i * 3] = xc.r;
        colorCNY[i * 3 + 1] = xc.g;
        colorCNY[i * 3 + 2] = xc.b;

        const mobileSizeBoost = isMobile ? 1.18 : 1.0;
        sizes[i] = (
          isGarland ? (1.6 + Math.random() * 1.45)
          : isJewel ? (1.9 + Math.random() * 1.35)
          : (1.0 + Math.random() * 1.35)
        ) * mobileSizeBoost;
        phases[i] = Math.random() * Math.PI * 2;
        // Dense, richly colored emerald pine foliage + sparkling fairy lights (no whiteout)
        boost[i] = isGarland ? (0.95 + Math.random() * 0.45) : isJewel ? (1.18 + Math.random() * 0.45) : (0.46 + Math.random() * 0.28);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(treePos, 3));
      geo.setAttribute('aScatterPos', new THREE.BufferAttribute(scatterPos, 3));
      geo.setAttribute('aColorXmas', new THREE.BufferAttribute(colorXmas, 3));
      geo.setAttribute('aColorCNY', new THREE.BufferAttribute(colorCNY, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
      geo.setAttribute('aBoost', new THREE.BufferAttribute(boost, 1));

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uScatter: { value: 0 },
          uTheme: { value: 0 },
          uDim: { value: 1.0 },
          uReveal: { value: 0.0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, isMobile ? 1.75 : 2) },
        },
        vertexShader: `
          attribute vec3 aScatterPos;
          attribute vec3 aColorXmas;
          attribute vec3 aColorCNY;
          attribute float aSize;
          attribute float aPhase;
          attribute float aBoost;

          uniform float uTime;
          uniform float uScatter;
          uniform float uTheme;
          uniform float uDim;
          uniform float uReveal;
          uniform float uPixelRatio;

          varying vec3 vColor;
          varying float vAlpha;

          mat2 rot2d(float a) {
            float c = cos(a);
            float s = sin(a);
            return mat2(c, -s, s, c);
          }

          void main() {
            float normY = clamp((position.y + 6.5) / 13.0, 0.0, 1.0);
            float revealMask = smoothstep(normY - 0.06, normY + 0.03, uReveal);
            float waveFlash = exp(-pow((uReveal - normY) * 14.0, 2.0)) * step(0.01, uReveal) * step(uReveal, 1.18);

            float s = clamp(uScatter, 0.0, 1.0);
            vec3 pos = mix(position, aScatterPos, s);

            float swirl = sin(s * 3.14159265) * (2.6 + position.y * 0.14);
            pos.xz = rot2d(swirl) * pos.xz;

            float breath = sin(uTime * 1.35 + aPhase * 6.0);
            pos.y += breath * mix(0.06, 0.42, s);
            pos.x += cos(uTime * 0.9 + aPhase * 4.0) * mix(0.04, 0.35, s);

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;

            float twinkle = 0.62 + 0.38 * sin(uTime * 2.8 + aPhase * 12.0);
            float sizeScale = aSize * (0.85 + 0.28 * twinkle + waveFlash * 0.85) * mix(1.0, 1.22, s) * revealMask;
            gl_PointSize = sizeScale * uPixelRatio * (76.0 / max(-mvPosition.z, 1.5));

            vec3 baseCol = mix(aColorXmas, aColorCNY, uTheme);
            vec3 ignitedCol = mix(baseCol, vec3(1.0, 0.88, 0.55), waveFlash * 0.72);
            vColor = ignitedCol * (aBoost + waveFlash * 1.1) * (0.82 + 0.3 * twinkle) * uDim;
            vAlpha = (0.50 + 0.28 * twinkle) * mix(0.95, 0.72, 1.0 - uDim) * revealMask;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            float core = smoothstep(0.5, 0.0, d);
            float halo = pow(core, 3.0);
            float hot = pow(core, 8.0) * 0.45;
            gl_FragColor = vec4(vColor * (halo + hot), halo * vAlpha);
          }
        `,
      });

      const points = new THREE.Points(geo, mat);
      worldGroup.add(points);
      return { points, mat };
    }

    const particleTree = createParticleTree();

    /* =========================================================================
       4.5 VISUAL MAGIC: FLOWING SPIRAL LIGHT RIBBONS, STAR-RING PEDESTAL & SNOW
       ========================================================================= */
    function createSpiralRibbons() {
      const ribbons = [];
      const configs = [
        { phase: 0, turns: 4.5, colA: '#ffe89e', colB: '#ff9e44', radiusOffset: 0.42 },
        { phase: Math.PI, turns: 4.0, colA: '#9be7ff', colB: '#ffd479', radiusOffset: 0.56 },
      ];

      configs.forEach((cfg) => {
        const pts = [];
        const steps = 110;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const y = -6.5 + t * 13.0;
          const r = 5.15 * Math.pow(1.0 - t, 0.93) + cfg.radiusOffset;
          const a = t * Math.PI * 2 * cfg.turns + cfg.phase;
          pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tubeGeo = new THREE.TubeGeometry(curve, isMobile ? 96 : 140, 0.028, 6, false);

        const mat = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          uniforms: {
            uTime: { value: 0 },
            uScatter: { value: 0 },
            uDim: { value: 1.0 },
            uReveal: { value: 0.0 },
            uColA: { value: new THREE.Color(cfg.colA) },
            uColB: { value: new THREE.Color(cfg.colB) },
            uPhase: { value: cfg.phase },
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform float uTime;
            uniform float uScatter;
            uniform float uDim;
            uniform float uReveal;
            uniform vec3 uColA;
            uniform vec3 uColB;
            uniform float uPhase;
            varying vec2 vUv;

            void main() {
              float revealMask = smoothstep(vUv.x - 0.04, vUv.x + 0.02, uReveal);
              float flow1 = smoothstep(0.0, 1.0, sin((vUv.x * 18.0 - uTime * 2.2 + uPhase)) * 0.5 + 0.5);
              float comet = pow(fract(vUv.x * 2.0 - uTime * 0.24 + uPhase * 0.15), 6.0);
              float edgeFade = smoothstep(0.0, 0.08, vUv.x) * smoothstep(1.0, 0.92, vUv.x);

              vec3 col = mix(uColA, uColB, flow1) * (0.62 + comet * 1.15) * uDim;
              float alpha = (0.14 + 0.22 * flow1 + 0.42 * comet) * edgeFade * (1.0 - uScatter * 0.92) * revealMask;
              gl_FragColor = vec4(col, alpha);
            }
          `,
        });

            float yFade = smoothstep(-13.0, -9.0, pos.y) * smoothstep(13.0, 9.5, pos.y);

        fragmentShader: `
          uniform sampler2D uTex;
          varying float vAlpha;
          void main() {
            vec4 tex = texture2D(uTex, gl_PointCoord);

      const t = nowMs * 0.001;
      giftCtx.clearRect(0, 0, giftSize, giftSize);
      giftCtx.globalCompositeOperation = 'lighter';

      const yaw = t * 0.65;
      const pitch = 0.34 + Math.sin(t * 1.1) * 0.06;
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const cp = Math.cos(pitch), sp = Math.sin(pitch);

      for (let i = 0; i < giftParticles.length; i++) {
        const p = giftParticles[i];
        if (giftBursting) {
          p.x += p.vx;
          p.y += p.vy;
          p.z += p.vz;
          p.vx *= 1.04;
          p.vy *= 1.04;
          p.vz *= 1.04;

        // 3D rotation
        const x1 = p.x * cy - p.z * sy;
        const z1 = p.x * sy + p.z * cy;
        const y2 = p.y * cp - z1 * sp;
        const z2 = p.y * sp + z1 * cp;

        const fov = 230;
        const persp = fov / (fov + z2 + 55);
        const sx = giftSize * 0.5 + x1 * persp;
        const syPos = giftSize * 0.54 + y2 * persp;

        const r = Math.max(0.6, p.size * persp * (0.85 + 0.3 * twinkle));

        giftCtx.globalAlpha = Math.min(1, twinkle * 0.85 * p.glow);
        giftCtx.fillStyle = p.color;
        giftCtx.beginPath();
        giftCtx.arc(sx, syPos, r * 1.85, 0, Math.PI * 2);
        giftCtx.fill();

        giftCtx.globalAlpha = Math.min(1, twinkle * 0.95);
        giftCtx.fillStyle = '#ffffff';
        giftCtx.beginPath();
        giftCtx.arc(sx, syPos, r * 0.65, 0, Math.PI * 2);
        giftCtx.fill();
      }

    function scheduleMusicBoxTone(freq, startTime, durSec, peakGain) {
      if (!musicBox.ctx || !musicBox.masterGain) return;
      const ctx = musicBox.ctx;
      const osc = ctx.createOscillator();
      const overtone = ctx.createOscillator();
      const noteGain = ctx.createGain();
      const ovGain = ctx.createGain();

      osc.type = 'sine';
      overtone.type = 'triangle';
      osc.frequency.setValueAtTime(freq, startTime);
      overtone.frequency.setValueAtTime(freq * 2.0, startTime);
      ovGain.gain.setValueAtTime(0.16, startTime);

      const decay = Math.max(0.55, durSec * 1.65);
      noteGain.gain.setValueAtTime(0.0001, startTime);
      noteGain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.016);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + decay);

      osc.connect(noteGain);
      overtone.connect(ovGain);
      ovGain.connect(noteGain);
      noteGain.connect(musicBox.masterGain);

      osc.start(startTime);
      overtone.start(startTime);
      osc.stop(startTime + decay + 0.05);
      overtone.stop(startTime + decay + 0.05);
    }

    function startMusicBoxLoop() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!musicBox.ctx) {
          musicBox.ctx = new AudioCtx();
          musicBox.masterGain = musicBox.ctx.createGain();
          musicBox.masterGain.gain.setValueAtTime(musicBox.muted ? 0.0001 : 0.85, musicBox.ctx.currentTime);
          musicBox.masterGain.connect(musicBox.ctx.destination);
        }
        if (musicBox.ctx.state === 'suspended') {
          musicBox.ctx.resume();
        }
        if (musicBox.running) return;

        musicBox.running = true;
        musicBox.stepIdx = 0;
        musicBox.nextNoteTime = musicBox.ctx.currentTime + 0.06;

        musicBox.timerId = setInterval(() => {
          if (!musicBox.running || !musicBox.ctx) return;
          while (musicBox.nextNoteTime < musicBox.ctx.currentTime + 0.28) {
            const [mel, beats, bass] = MUSIC_BOX_SCORE[musicBox.stepIdx];
            const dur = beats * musicBox.beatSec;
            if (!musicBox.muted) {
              if (mel && NOTE_FREQ[mel]) {
                scheduleMusicBoxTone(NOTE_FREQ[mel], musicBox.nextNoteTime, dur, 0.075);
              }
              if (bass && NOTE_FREQ[bass]) {
                scheduleMusicBoxTone(NOTE_FREQ[bass], musicBox.nextNoteTime, dur * 1.4, 0.036);
              }
            }
            musicBox.nextNoteTime += dur;
            musicBox.stepIdx = (musicBox.stepIdx + 1) % MUSIC_BOX_SCORE.length;
          }
        }, 100);
      } catch (_) {}
    }

    function toggleMusicMute() {
      if (!musicBox.running) {
        musicBox.muted = false;
        startMusicBoxLoop();
        syncAudioButtonUI();
        showToast('🔊 圣诞八音盒已开启');
        return;
      }
      musicBox.muted = !musicBox.muted;
      syncAudioButtonUI();
      if (musicBox.ctx && musicBox.masterGain) {
        const now = musicBox.ctx.currentTime;
        if (musicBox.ctx.state === 'suspended' && !musicBox.muted) {
          musicBox.ctx.resume();
        }
        musicBox.masterGain.gain.cancelScheduledValues(now);
        musicBox.masterGain.gain.setValueAtTime(musicBox.masterGain.gain.value, now);
        musicBox.masterGain.gain.linearRampToValueAtTime(musicBox.muted ? 0.0001 : 0.85, now + 0.18);
      }
      showToast(musicBox.muted ? '🔇 已静音' : '🔊 圣诞八音盒已开启');

    /* =========================================================================
       5. TREE TOPPER: 3D GLOWING STAR & CNY STARBURST
       ========================================================================= */
    function createStarTopper() {
      const group = new THREE.Group();
      const homePos = new THREE.Vector3(0, 6.95, 0);
      const scatterPos = new THREE.Vector3(0, 11.5, -2.5);
      group.position.copy(homePos);

      const starShape = new THREE.Shape();
      const outerR = 0.88;
      const innerR = 0.38;
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = (i * Math.PI) / 5 + Math.PI / 2;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) starShape.moveTo(x, y);
        else starShape.lineTo(x, y);
      }
      starShape.closePath();

      const starGeo = new THREE.ExtrudeGeometry(starShape, {
        depth: 0.22,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.08,
        bevelSegments: 2,
      });
      starGeo.center();

      const starMat = new THREE.MeshStandardMaterial({
        color: 0xffe066,
        emissive: 0xffb82e,
        emissiveIntensity: 2.3,
        metalness: 0.85,
        roughness: 0.18,
      });

      const starMesh = new THREE.Mesh(starGeo, starMat);
      group.add(starMesh);

      const flareCanvas = document.createElement('canvas');
      flareCanvas.width = 256;
      flareCanvas.height = 256;
      const ctx = flareCanvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 4, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255, 250, 220, 1.0)');
      grad.addColorStop(0.22, 'rgba(255, 212, 96, 0.72)');
      grad.addColorStop(0.55, 'rgba(255, 160, 40, 0.22)');
      grad.addColorStop(1, 'rgba(255, 120, 0, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      ctx.save();
      ctx.translate(128, 128);
      for (let k = 0; k < 4; k++) {
        ctx.rotate(Math.PI / 4);
        const rayGrad = ctx.createLinearGradient(0, -120, 0, 120);
        rayGrad.addColorStop(0, 'rgba(255,240,180,0)');
        rayGrad.addColorStop(0.5, 'rgba(255,245,210,0.45)');
        rayGrad.addColorStop(1, 'rgba(255,240,180,0)');
        ctx.fillStyle = rayGrad;
        ctx.fillRect(-3, -120, 6, 240);
      }
      ctx.restore();

      const flareTex = new THREE.CanvasTexture(flareCanvas);
      const flareMat = new THREE.SpriteMaterial({
        map: flareTex,
        color: 0xffdf80,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const flareSprite = new THREE.Sprite(flareMat);
      flareSprite.scale.set(4.2, 4.2, 1);
      group.add(flareSprite);

      const rayGroup = new THREE.Group();
      const rayGeo = new THREE.OctahedronGeometry(0.14, 0);
      rayGeo.scale(0.35, 6.8, 0.35);
      const rayMat = new THREE.MeshBasicMaterial({
        color: 0xffe484,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      for (let i = 0; i < 4; i++) {
        const m = new THREE.Mesh(rayGeo, rayMat);
        m.rotation.z = (i * Math.PI) / 4;
        rayGroup.add(m);
      }
      group.add(rayGroup);

      worldGroup.add(group);
      return { group, starMesh, starMat, flareSprite, rayGroup, rayMat, homePos, scatterPos };
    }

    const starTopper = createStarTopper();
