    function renderProceduralArt(ctx, w, h, cfg) {
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, cfg.palette[0]);
      bg.addColorStop(0.55, cfg.palette[1]);
      bg.addColorStop(1, cfg.palette[2]);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 60; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h * 0.65;
        const r = 0.8 + Math.random() * 2.2;
        ctx.fillStyle = `rgba(255, 250, 230, ${0.35 + Math.random() * 0.65})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (cfg.kind === 'aurora') {
        for (let b = 0; b < 3; b++) {
          const g = ctx.createLinearGradient(0, h * 0.1, w, h * 0.5);
          g.addColorStop(0, 'rgba(24,224,150,0)');
          g.addColorStop(0.4, 'rgba(24,224,150,0.45)');
          g.addColorStop(0.7, 'rgba(120,230,255,0.38)');
          g.addColorStop(1, 'rgba(24,224,150,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(0, h * (0.28 + b * 0.08));
          ctx.bezierCurveTo(w * 0.3, h * (0.05 + b * 0.06), w * 0.65, h * (0.48 - b * 0.05), w, h * (0.2 + b * 0.07));
          ctx.lineTo(w, h * (0.45 + b * 0.08));
          ctx.lineTo(0, h * (0.5 + b * 0.08));
          ctx.closePath();
          ctx.fill();
        }
        ctx.fillStyle = '#03111c';
        ctx.fillRect(0, h * 0.74, w, h * 0.26);
        for (let i = 0; i < 16; i++) {
          const tx = (i / 15) * w;
          const th = 70 + (i % 4) * 28;
          ctx.beginPath();
          ctx.moveTo(tx, h * 0.76 - th);
          ctx.lineTo(tx - 26, h * 0.78);
          ctx.lineTo(tx + 26, h * 0.78);
          ctx.closePath();
          ctx.fill();
        }
      } else if (cfg.kind === 'lanterns') {
        const water = ctx.createLinearGradient(0, h * 0.65, 0, h);
        water.addColorStop(0, '#38040e');
        water.addColorStop(1, '#120104');
        ctx.fillStyle = water;
        ctx.fillRect(0, h * 0.65, w, h * 0.35);
        for (let i = 0; i < 18; i++) {
          const lx = 40 + Math.random() * (w - 80);
          const ly = 50 + Math.random() * (h * 0.52);
          const lr = 10 + Math.random() * 14;
          const lg = ctx.createRadialGradient(lx, ly, 2, lx, ly, lr * 2.5);
          lg.addColorStop(0, 'rgba(255,240,160,0.95)');
          lg.addColorStop(0.4, 'rgba(255,140,20,0.45)');
          lg.addColorStop(1, 'rgba(255,80,0,0)');
          ctx.fillStyle = lg;
          ctx.beginPath();
          ctx.arc(lx, ly, lr * 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffcf56';
          ctx.fillRect(lx - lr * 0.45, ly - lr * 0.65, lr * 0.9, lr * 1.1);
        }
      } else if (cfg.kind === 'fireworks') {
        const bursts = [
          { x: w * 0.32, y: h * 0.32, r: 95, col: '#ffd166' },
          { x: w * 0.68, y: h * 0.28, r: 110, col: '#ff6b6b' },
          { x: w * 0.52, y: h * 0.48, r: 75, col: '#72efdd' },
        ];
        bursts.forEach((b) => {
          for (let k = 0; k < 28; k++) {
            const a = (k / 28) * Math.PI * 2;
            ctx.strokeStyle = b.col;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x + Math.cos(a) * b.r, b.y + Math.sin(a) * b.r);
            ctx.stroke();
          }
        });
        ctx.fillStyle = '#090514';
        ctx.fillRect(0, h * 0.78, w, h * 0.22);
      } else if (cfg.kind === 'cabin') {
        ctx.fillStyle = '#dce7f5';
        ctx.beginPath();
        ctx.ellipse(w * 0.5, h * 0.95, w * 0.75, h * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2d1e17';
        ctx.fillRect(w * 0.36, h * 0.56, w * 0.28, h * 0.22);
        ctx.beginPath();
        ctx.moveTo(w * 0.31, h * 0.58);
        ctx.lineTo(w * 0.5, h * 0.42);
        ctx.lineTo(w * 0.69, h * 0.58);
        ctx.closePath();
        ctx.fill();
        ctx.shadowColor = '#ffb703';
        ctx.shadowBlur = 24;
        ctx.fillStyle = '#ffe184';
        ctx.fillRect(w * 0.45, h * 0.62, w * 0.1, h * 0.09);
        ctx.shadowBlur = 0;
      } else if (cfg.kind === 'moonlake') {
        const mg = ctx.createRadialGradient(w * 0.5, h * 0.3, 8, w * 0.5, h * 0.3, 95);
        mg.addColorStop(0, '#ffffff');
        mg.addColorStop(0.45, 'rgba(220,240,255,0.45)');
        mg.addColorStop(1, 'rgba(220,240,255,0)');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(w * 0.5, h * 0.3, 95, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0c1f38';
        ctx.fillRect(0, h * 0.64, w, h * 0.36);
        for (let i = 0; i < 16; i++) {
          ctx.fillStyle = `rgba(240, 248, 255, ${0.5 - i * 0.025})`;
          ctx.fillRect(w * 0.5 - (46 - i * 2), h * 0.67 + i * 9, (46 - i * 2) * 2, 3);
        }
      } else if (cfg.kind === 'sparklers') {
        for (let i = 0; i < 24; i++) {
          const x = Math.random() * w;
          const y = Math.random() * h;
          const r = 16 + Math.random() * 44;
          const g = ctx.createRadialGradient(x, y, 2, x, y, r);
          g.addColorStop(0, 'rgba(255, 240, 190, 0.85)');
          g.addColorStop(0.5, 'rgba(255, 170, 50, 0.25)');
          g.addColorStop(1, 'rgba(255, 120, 0, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = '#1b264f';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.78);
        ctx.lineTo(w * 0.28, h * 0.38);
        ctx.lineTo(w * 0.55, h * 0.68);
        ctx.lineTo(w * 0.78, h * 0.32);
        ctx.lineTo(w, h * 0.74);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 244, 230, 0.85)';
        ctx.beginPath();
        ctx.moveTo(w * 0.78, h * 0.32);
        ctx.lineTo(w * 0.71, h * 0.45);
        ctx.lineTo(w * 0.84, h * 0.44);
        ctx.closePath();
        ctx.fill();
      }
    }

    function buildPolaroidTexture(sourceImgOrCfg, caption) {
      // Slightly compact resolution on mobile so 25 Polaroids stay light on iPhone GPU memory
      const cw = isMobile ? 420 : 512;
      const ch = isMobile ? 508 : 620;
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ecebe6';
      ctx.fillRect(0, 0, cw, ch);

      ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, cw - 4, ch - 4);

      const pad = Math.round(cw * 0.0625);
      const imgW = cw - pad * 2;
      const imgH = imgW;

      ctx.save();
      ctx.beginPath();
      ctx.rect(pad, pad, imgW, imgH);
      ctx.clip();

      if (sourceImgOrCfg instanceof HTMLImageElement) {
        const scale = Math.max(imgW / sourceImgOrCfg.width, imgH / sourceImgOrCfg.height);
        const dw = sourceImgOrCfg.width * scale;
        const dh = sourceImgOrCfg.height * scale;
        ctx.drawImage(sourceImgOrCfg, pad + (imgW - dw) / 2, pad + (imgH - dh) / 2, dw, dh);
      } else {
        ctx.translate(pad, pad);
        renderProceduralArt(ctx, imgW, imgH, sourceImgOrCfg);
      }
      ctx.restore();

      ctx.strokeStyle = 'rgba(0,0,0,0.14)';
      ctx.lineWidth = 2;
      ctx.strokeRect(pad, pad, imgW, imgH);

      ctx.fillStyle = '#3a3835';
      ctx.font = 'italic 25px "Georgia", "PingFang SC", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(caption || 'Holiday Memory', cw / 2, pad + imgH + (ch - pad - imgH) / 2);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    function createSoftCardGlowTex() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 18, 64, 64, 64);
      g.addColorStop(0, 'rgba(255, 224, 150, 0.42)');
      g.addColorStop(0.55, 'rgba(255, 200, 120, 0.14)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    const cardGlowTex = createSoftCardGlowTex();
    const polaroidCards = [];
    const polaroidGeo = new THREE.PlaneGeometry(3.4, 4.12);
    const cardBackGeo = new THREE.PlaneGeometry(3.4, 4.12);
    const glowPlaneGeo = new THREE.PlaneGeometry(4.4, 5.1);

    function initPolaroidDeck() {
      DEFAULT_MEMORIES.forEach((mem, idx) => {
        const group = new THREE.Group();

        const tex = buildPolaroidTexture(mem, mem.title);
        const frontMat = new THREE.MeshBasicMaterial({
          map: tex,
          color: new THREE.Color(0xcfcfcf),
        });
        const frontMesh = new THREE.Mesh(polaroidGeo, frontMat);
        group.add(frontMesh);

        const backMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(0xb8b5ae),
          side: THREE.BackSide,
        });
        const backMesh = new THREE.Mesh(cardBackGeo, backMat);
        backMesh.position.z = -0.01;
        group.add(backMesh);

        const glowMat = new THREE.MeshBasicMaterial({
          map: cardGlowTex,
          transparent: true,
          opacity: 0.45,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        const glowMesh = new THREE.Mesh(glowPlaneGeo, glowMat);
        glowMesh.position.z = -0.04;
        group.add(glowMesh);

        // Even golden-angle spiral distribution for 25 Polaroids across tree & 3D nebula
        const total = DEFAULT_MEMORIES.length;
        const frac = (idx + 0.5) / total;
        const goldenAngle = idx * 2.3999632;

        const treeY = -4.6 + frac * 9.2;
        const treeConeR = Math.max(0.85, 3.6 * (1.0 - frac * 0.78));
        const treeHome = new THREE.Vector3(
          Math.cos(goldenAngle) * treeConeR,
          treeY,
          Math.sin(goldenAngle) * treeConeR
        );

        const phi = Math.acos(1 - 2 * frac);
        const nebR = 8.4 + (idx % 4) * 1.9;
        const nebulaHome = new THREE.Vector3(
          nebR * Math.sin(phi) * Math.cos(goldenAngle),
          nebR * Math.cos(phi) * 0.68,
          nebR * Math.sin(phi) * Math.sin(goldenAngle)
        );

        group.position.copy(treeHome);
        group.scale.setScalar(0.14);
        scene.add(group);

        polaroidCards.push({
          group,
          frontMat,
          glowMat,
          treeHome,
          nebulaHome,
          phase: idx * 1.13,
          rotSeed: new THREE.Euler(
            (Math.random() - 0.5) * 0.5,
            Math.random() * Math.PI * 2,
            (Math.random() - 0.5) * 0.35
          ),
        });
      });
      state.photoCount = polaroidCards.length;
    }

    initPolaroidDeck();

    /* =========================================================================
       8. UI CONTROLS, POLAROID NAV & LOCAL PHOTO UPLOAD
       ========================================================================= */
    const btnScatter = document.getElementById('btn-scatter');
    const btnPhoto = document.getElementById('btn-photo');
    const btnCamera = document.getElementById('btn-camera');
    const btnGuide = document.getElementById('btn-guide');
    const guideEl = document.getElementById('gesture-guide');
    const controlBar = document.getElementById('control-bar');
    const polaroidNav = document.getElementById('polaroid-nav');
    const polaroidCounter = document.getElementById('polaroid-counter');

    function syncPolaroidUI() {
      const open = state.activePhotoIndex !== -1;
      polaroidNav.classList.toggle('visible', open);
      btnPhoto.classList.toggle('active', open);
      if (open) {
        polaroidCounter.textContent = `${state.activePhotoIndex + 1} / ${state.photoCount}`;
      }
    }

    function setScatterMode(scatter) {
      const target = scatter ? 1 : 0;
      if (state.scatterTarget !== target) {
        state.scatterTarget = target;
        btnScatter.classList.toggle('active', scatter);
        if (!scatter && state.activePhotoIndex !== -1) {
          state.activePhotoIndex = -1;
          syncPolaroidUI();
        }
        showToast(scatter ? '✨ 粒子星云散开 · 单击屏幕可浮现拍立得' : '🎄 引力螺旋聚拢 · 重塑圣诞树');
      }
    }

    function grabPolaroid(next = false) {
      if (state.scatterTarget < 0.5) {
        state.scatterTarget = 1;
        btnScatter.classList.add('active');
      }
      if (state.activePhotoIndex === -1) {
        state.activePhotoIndex = state.lastPhotoIndex % state.photoCount;
      } else if (next) {
        state.activePhotoIndex = (state.activePhotoIndex + 1) % state.photoCount;
        state.lastPhotoIndex = state.activePhotoIndex;
      }
      syncPolaroidUI();
      showToast(`📸 拍立得记忆 (${state.activePhotoIndex + 1} / ${state.photoCount})`);
    }

    function stepPolaroid(delta) {
      if (state.activePhotoIndex === -1) {
        grabPolaroid(false);
        return;
      }
      state.activePhotoIndex = (state.activePhotoIndex + delta + state.photoCount) % state.photoCount;
      state.lastPhotoIndex = state.activePhotoIndex;
      syncPolaroidUI();
    }

    function releasePolaroid() {
      if (state.activePhotoIndex !== -1) {
        state.lastPhotoIndex = (state.activePhotoIndex + 1) % state.photoCount;
        state.activePhotoIndex = -1;
        syncPolaroidUI();
      }
    }

    btnScatter.addEventListener('click', () => setScatterMode(state.scatterTarget < 0.5));
    btnPhoto.addEventListener('click', () => {
      if (state.activePhotoIndex === -1) grabPolaroid(false);
      else stepPolaroid(1);
    });

    document.getElementById('btn-prev-photo').addEventListener('click', () => stepPolaroid(-1));
    document.getElementById('btn-next-photo').addEventListener('click', () => stepPolaroid(1));
    document.getElementById('btn-close-photo').addEventListener('click', releasePolaroid);

    /* =========================================================================
       7.5 INDEXEDDB PERSISTENT PHOTO STORAGE (25 SLOTS, AUTO-COMPRESS & RESTORE)
       ========================================================================= */
    const PHOTO_DB_NAME = 'HolidayTreePhotoDB';
    const PHOTO_STORE_NAME = 'photos';
    const savedStatusEl = document.getElementById('saved-photo-status');

    function updateSavedPhotoStatus(count) {
      if (savedStatusEl) {
        savedStatusEl.textContent = `本地已保存 ${count} / ${polaroidCards.length} 张`;
      }
    }

    function openPhotoDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
        const req = indexedDB.open(PHOTO_DB_NAME, 1);
        req.onupgradeneeded = (ev) => {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains(PHOTO_STORE_NAME)) {
            db.createObjectStore(PHOTO_STORE_NAME, { keyPath: 'index' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function savePhotosToDB(records) {
      try {
        const db = await openPhotoDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(PHOTO_STORE_NAME, 'readwrite');
          const store = tx.objectStore(PHOTO_STORE_NAME);
          records.forEach((rec) => store.put(rec));
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
        db.close();
        return true;
      } catch (_) {
        return false;
      }
    }

    async function loadAllPhotosFromDB() {
      try {
        const db = await openPhotoDB();
        const items = await new Promise((resolve, reject) => {
          const tx = db.transaction(PHOTO_STORE_NAME, 'readonly');
          const req = tx.objectStore(PHOTO_STORE_NAME).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
        db.close();
        return items;
      } catch (_) {
        return [];
      }
    }

    async function clearPhotosFromDB() {
      try {
        const db = await openPhotoDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(PHOTO_STORE_NAME, 'readwrite');
          tx.objectStore(PHOTO_STORE_NAME).clear();
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
        db.close();
      } catch (_) {}
    }

    // Center-crop & compress uploaded image to 640x640 JPEG (~70KB) for fast, safe IndexedDB persistence
    function compressImageToDataUrl(img, maxSide = 640, quality = 0.84) {
      const c = document.createElement('canvas');
      c.width = maxSide;
      c.height = maxSide;
      const ctx = c.getContext('2d');
      const scale = Math.max(maxSide / img.width, maxSide / img.height);
      const dw = img.width * scale;
      const dh = img.height * scale;
      ctx.drawImage(img, (maxSide - dw) / 2, (maxSide - dh) / 2, dw, dh);
      return c.toDataURL('image/jpeg', quality);
    }

    function applyImageToCard(index, img, caption) {
      const card = polaroidCards[index];
      if (!card) return;
      const newTex = buildPolaroidTexture(img, caption);
      if (card.frontMat.map) card.frontMat.map.dispose();
      card.frontMat.map = newTex;
      card.frontMat.needsUpdate = true;
    }

    function loadBundledPhoto(index) {
      return new Promise((resolve) => {
        const num = String(index + 1).padStart(2, '0');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          applyImageToCard(index, img, `Memory · ${num}`);
          resolve(true);
        };
        img.onerror = () => resolve(false);
        img.src = `./photos/photo-${num}.jpg`;
      });
    }

    async function loadBundledAndSavedPhotos() {
      // 1. Load the 25 bundled photos from ./photos/photo-01.jpg .. photo-25.jpg
      await Promise.all(polaroidCards.map((_, idx) => loadBundledPhoto(idx)));

      // 2. Overlay any locally persisted IndexedDB custom uploads
      const saved = await loadAllPhotosFromDB();
      if (!saved.length) {
        updateSavedPhotoStatus(0);
        return;
      }
      let restored = 0;
      await Promise.all(
        saved.map((rec) => new Promise((resolve) => {
          if (rec.index < 0 || rec.index >= polaroidCards.length) return resolve();
          const img = new Image();
          img.onload = () => {
            applyImageToCard(rec.index, img, rec.caption);
            restored++;
            resolve();
          };
          img.onerror = () => resolve();
          img.src = rec.dataUrl;
        }))
      );
      updateSavedPhotoStatus(restored);
      if (restored > 0) {
        showToast(`💾 已自动恢复 ${restored} 张本地保存的拍立得照片`, 2800);
      }
    }

    loadBundledAndSavedPhotos();

    const uploadInput = document.getElementById('photo-upload-input');
    document.getElementById('btn-upload').addEventListener('click', () => uploadInput.click());
    uploadInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      let loaded = 0;
      const limit = Math.min(files.length, polaroidCards.length);
      const pendingRecords = [];

      files.slice(0, limit).forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = async () => {
            const cleanName = file.name.replace(/\.[^/.]+$/, '').slice(0, 20);
            applyImageToCard(i, img, cleanName);

            const compressedUrl = compressImageToDataUrl(img);
            pendingRecords.push({
              index: i,
              dataUrl: compressedUrl,
              caption: cleanName,
              updatedAt: Date.now(),
            });

            loaded++;
            if (loaded === limit) {
              const savedOk = await savePhotosToDB(pendingRecords);
              const allSaved = await loadAllPhotosFromDB();
              updateSavedPhotoStatus(allSaved.length);
              showToast(
                savedOk
                  ? `💾 已更新并本地保存 ${loaded} 张拍立得照片 (刷新不丢失)`
                  : `🖼️ 已更新 ${loaded} 张拍立得照片 (当前浏览模式不支持本地存储)`,
                3000
              );
              state.lastPhotoIndex = 0;
              if (state.activePhotoIndex !== -1) {
                state.activePhotoIndex = 0;
                syncPolaroidUI();
              }
            }
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      uploadInput.value = '';
    });

    document.getElementById('btn-reset-photos').addEventListener('click', async () => {
      await clearPhotosFromDB();
      await Promise.all(
        DEFAULT_MEMORIES.map(async (mem, idx) => {
          const ok = await loadBundledPhoto(idx);
          if (!ok) {
            const card = polaroidCards[idx];
            const tex = buildPolaroidTexture(mem, mem.title);
            if (card.frontMat.map) card.frontMat.map.dispose();
            card.frontMat.map = tex;
            card.frontMat.needsUpdate = true;
          }
        })
      );
      updateSavedPhotoStatus(0);
      showToast('✨ 已清除本地缓存并恢复 25 张默认照片');
    });

    btnGuide.addEventListener('click', () => {
      const open = guideEl.classList.toggle('open');
      btnGuide.classList.toggle('active', open);
      controlBar.classList.toggle('pinned', open);
    });

    /* =========================================================================
       9. iPHONE NATIVE MULTI-TOUCH (SNAPPY PINCH-TO-SCATTER + TAP POLAROID) & DESKTOP
       ========================================================================= */
    const domEl = renderer.domElement;
    let lastPinchDist = 0;
    let lastTapTime = 0;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchMoved = false;
    let mouseStartX = 0;
    let mouseStartY = 0;
    let mouseMoved = false;

    function checkZoomAutoScatter() {
      const scatterThreshold = isPortrait() ? 19.0 : 15.0;
      const gatherThreshold = isPortrait() ? 33.0 : 27.5;
      if (state.camDistTarget <= scatterThreshold && state.scatterTarget < 0.5) {
        setScatterMode(true);
      } else if (state.camDistTarget >= gatherThreshold && state.scatterTarget > 0.5) {
        setScatterMode(false);
      }
    }

    // Prevent iOS Safari native pinch-to-zoom page scaling
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((evtName) => {
      document.addEventListener(evtName, (e) => e.preventDefault(), { passive: false });
    });

    // Native Touch Events for iPhone (1:1 responsive ratio pinch & snappy drag)
    domEl.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        const t = e.touches[0];
        state.isDragging = true;
        state.lastPointerX = t.clientX;
        state.lastPointerY = t.clientY;
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchMoved = false;
        lastPinchDist = 0;
      } else if (e.touches.length === 2) {
        state.isDragging = false;
        touchMoved = true;
        lastPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    domEl.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (lastPinchDist > 4 && dist > 4) {
          // Multiplicative finger-ratio zoom feels 1:1 glued to fingers
          const ratio = Math.pow(lastPinchDist / dist, 1.25);
          state.camDistTarget = THREE.MathUtils.clamp(state.camDistTarget * ratio, 9.5, 44.0);
          checkZoomAutoScatter();
        }
        lastPinchDist = dist;
        return;
      }

      if (e.touches.length === 1 && state.isDragging) {
        const t = e.touches[0];
        const dx = t.clientX - state.lastPointerX;
        const dy = t.clientY - state.lastPointerY;
        if (Math.hypot(t.clientX - touchStartX, t.clientY - touchStartY) > 8) {
          touchMoved = true;
        }
        state.lastPointerX = t.clientX;
        state.lastPointerY = t.clientY;

        state.camYawTarget -= dx * 0.0125;
        state.camPitchTarget = THREE.MathUtils.clamp(state.camPitchTarget + dy * 0.0082, -0.58, 0.75);
      }
    }, { passive: false });

    domEl.addEventListener('touchend', (e) => {
      if (e.touches.length === 1) {
        state.isDragging = true;
        state.lastPointerX = e.touches[0].clientX;
        state.lastPointerY = e.touches[0].clientY;
        lastPinchDist = 0;
        return;
      }
      if (e.touches.length === 0) {
        state.isDragging = false;
        lastPinchDist = 0;
        if (!touchMoved) {
          const now = performance.now();
          if (now - lastTapTime < 280) {
            // Double tap toggles scatter / gather
            setScatterMode(state.scatterTarget < 0.5);
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            // In scattered nebula mode, single tap pops up / cycles Polaroid immediately
            if (state.scatterTarget > 0.5) {
              grabPolaroid(true);
            }
          }
        }
      }
    }, { passive: true });

    domEl.addEventListener('touchcancel', () => {
      state.isDragging = false;
      lastPinchDist = 0;
    });

    // Desktop Mouse Controls
    domEl.addEventListener('mousedown', (e) => {
      state.isDragging = true;
      state.lastPointerX = e.clientX;
      state.lastPointerY = e.clientY;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
      mouseMoved = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!state.isDragging) return;
      const dx = e.clientX - state.lastPointerX;
      const dy = e.clientY - state.lastPointerY;
      if (Math.hypot(e.clientX - mouseStartX, e.clientY - mouseStartY) > 6) {
        mouseMoved = true;
      }
      state.lastPointerX = e.clientX;
      state.lastPointerY = e.clientY;

      state.camYawTarget -= dx * 0.0072;
      state.camPitchTarget = THREE.MathUtils.clamp(state.camPitchTarget + dy * 0.005, -0.55, 0.72);
    });

    window.addEventListener('mouseup', () => {
      if (state.isDragging && !mouseMoved && state.scatterTarget > 0.5) {
        grabPolaroid(true);
      }
      state.isDragging = false;
    });

    domEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      state.camDistTarget = THREE.MathUtils.clamp(state.camDistTarget + e.deltaY * 0.015, 10.0, 42.0);
      checkZoomAutoScatter();
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        setScatterMode(state.scatterTarget < 0.5);
      } else if (e.key === 'p' || e.key === 'P' || e.key === 'Enter') {
        if (state.activePhotoIndex === -1) grabPolaroid(false);
        else releasePolaroid();
      } else if (e.key === 'ArrowRight') {
        stepPolaroid(1);
      } else if (e.key === 'ArrowLeft') {
        stepPolaroid(-1);
      } else if (e.key === 'c' || e.key === 'C') {
        toggleCameraTracking();
      } else if (e.key === 'm' || e.key === 'M') {
        toggleMusicMute();
      }
    });

    /* =========================================================================
       10. MEDIAPIPE HANDS (MULTI-CDN + iPHONE SAFARI OPTIMIZED)
       ========================================================================= */
    const videoEl = document.getElementById('webcam-video');
    const handCanvas = document.getElementById('hand-canvas');
    const handCtx = handCanvas.getContext('2d');
    const previewWrap = document.getElementById('camera-preview-wrap');
    const gestureLabelEl = document.getElementById('gesture-label');

    let mpHands = null;
    let mediaStream = null;
    let handLoopRunning = false;
    let lastHandInferTime = 0;

    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],[0,17]
    ];

    function dist2D(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function classifySingleHand(lm) {
      const wrist = lm[0];
      const handSize = Math.max(dist2D(wrist, lm[9]), 0.04);

      const isExtended = (tipIdx, pipIdx) =>
        dist2D(wrist, lm[tipIdx]) > dist2D(wrist, lm[pipIdx]) * 1.14;

      const indexUp = isExtended(8, 6);
      const middleUp = isExtended(12, 10);
      const ringUp = isExtended(16, 14);
      const pinkyUp = isExtended(20, 18);
      const thumbUp = dist2D(lm[4], lm[17]) > dist2D(lm[3], lm[17]) * 1.08;

      const extendedCount = [thumbUp, indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length;
      const pinchRatio = dist2D(lm[4], lm[8]) / handSize;

      if (pinchRatio < 0.36 && (middleUp || ringUp || pinkyUp || extendedCount >= 1)) {
        return 'PINCH';
      }
      if (indexUp && middleUp && !ringUp && !pinkyUp) {
        return 'VICTORY';
      }
      if (extendedCount >= 4 && indexUp && middleUp && ringUp && pinkyUp) {
        return 'OPEN_PALM';
      }
      if (!indexUp && !middleUp && !ringUp && !pinkyUp) {
        return 'FIST';
      }
      return 'NEUTRAL';
    }

    function drawHandSkeleton(multiLandmarks) {
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
      if (!multiLandmarks || !multiLandmarks.length) return;

      for (const lm of multiLandmarks) {
        handCtx.strokeStyle = 'rgba(255, 214, 102, 0.82)';
        handCtx.lineWidth = 1.6;
        for (const [a, b] of HAND_CONNECTIONS) {
          handCtx.beginPath();
          handCtx.moveTo(lm[a].x * handCanvas.width, lm[a].y * handCanvas.height);
          handCtx.lineTo(lm[b].x * handCanvas.width, lm[b].y * handCanvas.height);
          handCtx.stroke();
        }
        for (let i = 0; i < lm.length; i++) {
          const isTip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
          handCtx.fillStyle = isTip ? '#fff7d6' : '#ffae33';
          handCtx.beginPath();
          handCtx.arc(lm[i].x * handCanvas.width, lm[i].y * handCanvas.height, isTip ? 2.8 : 1.7, 0, Math.PI * 2);
          handCtx.fill();
        }
      }
    }

    function onHandResults(results) {
      const hands = results.multiHandLandmarks || [];
      drawHandSkeleton(hands);

      const now = performance.now();

      if (!hands.length) {
        state.handDetected = false;
        gestureLabelEl.textContent = '等待手势...';
        return;
      }

      state.handDetected = true;
      const primary = hands[0];
      const palm = primary[9];

      state.handNormX = 1.0 - palm.x;
      state.handNormY = palm.y;

      const g1 = classifySingleHand(primary);
      const g2 = hands.length > 1 ? classifySingleHand(hands[1]) : 'NONE';
      const rawGesture = (g1 === 'PINCH' || g2 === 'PINCH') ? 'PINCH' : g1;

      if (rawGesture === state.lastRawGesture) {
        state.gestureStableFrames++;
      } else {
        state.lastRawGesture = rawGesture;
        state.gestureStableFrames = 1;
      }

      if (state.gestureStableFrames >= 3) {
        state.currentGesture = rawGesture;

        if (rawGesture === 'OPEN_PALM') {
          gestureLabelEl.textContent = '🖐️ 星云散开';
          setScatterMode(true);
          if (state.activePhotoIndex !== -1) releasePolaroid();
          state.isPinching = false;
        } else if (rawGesture === 'FIST') {
          gestureLabelEl.textContent = '✊ 聚拢圣诞树';
          setScatterMode(false);
          state.isPinching = false;
        } else if (rawGesture === 'PINCH') {
          gestureLabelEl.textContent = '🤏 拍立得';
          if (!state.isPinching) {
            state.isPinching = true;
            state.pinchAnchorX = state.handNormX;
            grabPolaroid(state.scatterCurrent > 0.35 || state.scatterTarget > 0.5);
          } else if (now > state.pinchSwipeCooldown) {
            const dx = state.handNormX - state.pinchAnchorX;
            if (Math.abs(dx) > 0.16) {
              stepPolaroid(dx > 0 ? 1 : -1);
              state.pinchAnchorX = state.handNormX;
              state.pinchSwipeCooldown = now + 750;
            }
          }
        } else {
          state.isPinching = false;
          gestureLabelEl.textContent = '👋 旋转视角';
        }
      }
    }

    async function startCameraTracking() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('⚠️ 当前环境不支持摄像头（iPhone 请使用 HTTPS 链接或直接触控交互）', 4200);
        return;
      }

      showToast('⏳ 正在自动匹配可用手势引擎节点...', 4000);
      let cdnBase;
      try {
        cdnBase = await ensureMediaPipeLoaded();
      } catch (err) {
        showToast('⚠️ 所有手势引擎 CDN 均无法连接，请直接使用屏幕触控交互', 4000);
        return;
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: isMobile ? 240 : 320 },
            height: { ideal: isMobile ? 320 : 240 },
            facingMode: 'user',
          },
          audio: false,
        });
        videoEl.srcObject = mediaStream;
        await videoEl.play();

        if (!mpHands) {
          mpHands = new window.Hands({
            locateFile: (file) => `${cdnBase}${file}`,
          });
          mpHands.setOptions({
            maxNumHands: 2,
            // Lite model (0) on iPhone keeps 60 FPS WebGL smooth and cool
            modelComplexity: isMobile ? 0 : 1,
            minDetectionConfidence: 0.62,
            minTrackingConfidence: 0.58,
          });
          mpHands.onResults(onHandResults);
        }

        state.cameraActive = true;
        state.previewVisible = true;
        previewWrap.classList.add('visible');
        btnCamera.classList.add('active');
        showToast('📷 隔空手势追踪已开启');

        if (!handLoopRunning) {
          handLoopRunning = true;
          const minInterval = isMobile ? 45 : 30; // ~22 FPS hand inference on iPhone
          const processFrame = async (now) => {
            if (!state.cameraActive) {
              handLoopRunning = false;
              return;
            }
            if (videoEl.readyState >= 2 && now - lastHandInferTime >= minInterval) {
              lastHandInferTime = now;
              try {
                await mpHands.send({ image: videoEl });
              } catch (_) {}
            }
            requestAnimationFrame(processFrame);
          };
          requestAnimationFrame(processFrame);
        }
      } catch (err) {
        showToast('⚠️ 摄像头权限未授权，可直接单指滑动与双指缩放体验', 3500);
      }
    }

    function stopCameraTracking() {
      state.cameraActive = false;
      state.previewVisible = false;
      state.handDetected = false;
      handLoopRunning = false;
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
        mediaStream = null;
      }
      videoEl.srcObject = null;
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
      previewWrap.classList.remove('visible');
      btnCamera.classList.remove('active');
      showToast('📷 已关闭摄像头');
    }

    function toggleCameraTracking() {
      if (!state.cameraActive) {
        startCameraTracking();
      } else if (!state.previewVisible) {
        state.previewVisible = true;
        previewWrap.classList.add('visible');
        showToast('📷 已恢复手势预览窗');
      } else {
        stopCameraTracking();
      }
    }

    btnCamera.addEventListener('click', toggleCameraTracking);
    document.getElementById('btn-cam-hide').addEventListener('click', (e) => {
      e.stopPropagation();
      state.previewVisible = false;
      previewWrap.classList.remove('visible');
      showToast('🙈 已隐藏预览窗（点底部 📷 可恢复或关闭）');
    });
    document.getElementById('btn-cam-close').addEventListener('click', (e) => {
      e.stopPropagation();
      stopCameraTracking();
    });

    /* =========================================================================
       11. ANIMATION LOOP WITH SMOOTH LERP & iPHONE PORTRAIT FRAMING
       ========================================================================= */
    const tmpVec = new THREE.Vector3();
    const tmpQuat = new THREE.Quaternion();
    const camForward = new THREE.Vector3();
    const xmasKeyColor = new THREE.Color(0xffe4a0);
    const cnyKeyColor = new THREE.Color(0xffb84d);
    const xmasRimColor = new THREE.Color(0x4ea8ff);
    const cnyRimColor = new THREE.Color(0xff421f);
    const xmasStarColor = new THREE.Color(0xffe066);
    const cnyStarColor = new THREE.Color(0xffd038);

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      const lerpSmooth = 1 - Math.exp(-3.4 * dt);
      const scatterLerp = 1 - Math.exp(-2.8 * dt);
      state.themeCurrent = THREE.MathUtils.lerp(state.themeCurrent, state.themeTarget, lerpSmooth);
      state.scatterCurrent = THREE.MathUtils.lerp(state.scatterCurrent, state.scatterTarget, scatterLerp);

      if (state.handDetected && !state.isDragging) {
        const handLerp = 1 - Math.exp(-6.5 * dt);
        state.smoothedHandX = THREE.MathUtils.lerp(state.smoothedHandX, state.handNormX, handLerp);
        state.smoothedHandY = THREE.MathUtils.lerp(state.smoothedHandY, state.handNormY, handLerp);

        const offsetX = (state.smoothedHandX - 0.5) * 2.0;
        const offsetY = (state.smoothedHandY - 0.5) * 2.0;

        state.camYawTarget = offsetX * 1.45;
        state.camPitchTarget = THREE.MathUtils.clamp(-offsetY * 0.52 + 0.08, -0.48, 0.65);
        state.parallaxXTarget = offsetX * 1.25;
        state.parallaxYTarget = -offsetY * 0.8;
      } else {
        state.parallaxXTarget = 0;
        state.parallaxYTarget = 0;
        if (!state.isDragging) {
          state.autoSpinAngle += dt * (state.scatterCurrent > 0.5 ? 0.08 : 0.22);
        }
      }

      const camLerp = 1 - Math.exp(-(lastPinchDist > 0 ? 24.0 : state.isDragging ? 14.0 : 5.2) * dt);
      state.camYaw = THREE.MathUtils.lerp(state.camYaw, state.camYawTarget, camLerp);
      state.camPitch = THREE.MathUtils.lerp(state.camPitch, state.camPitchTarget, camLerp);
      state.camDist = THREE.MathUtils.lerp(state.camDist, state.camDistTarget, camLerp);
      state.parallaxX = THREE.MathUtils.lerp(state.parallaxX, state.parallaxXTarget, camLerp);
      state.parallaxY = THREE.MathUtils.lerp(state.parallaxY, state.parallaxYTarget, camLerp);

      const totalYaw = state.camYaw + state.autoSpinAngle;
      camera.position.set(
        Math.sin(totalYaw) * Math.cos(state.camPitch) * state.camDist + state.parallaxX,
        Math.sin(state.camPitch) * state.camDist + 0.5 + state.parallaxY,
        Math.cos(totalYaw) * Math.cos(state.camPitch) * state.camDist
      );
      camera.lookAt(state.parallaxX * 0.25, 0.2 + state.parallaxY * 0.2, 0);

      keyLight.color.lerpColors(xmasKeyColor, cnyKeyColor, state.themeCurrent);
      rimLight.color.lerpColors(xmasRimColor, cnyRimColor, state.themeCurrent);
      innerTreeLight.intensity = THREE.MathUtils.lerp(3.5, 1.4, state.scatterCurrent);

      bgStardust.mat.uniforms.uTime.value = elapsed;
      bgStardust.mat.uniforms.uTheme.value = state.themeCurrent;

      // Opening sequence progression ('WAIT' -> 'LIGHTING' -> 'DONE')
      let starFlashBoost = 0;
      if (state.introStage === 'WAIT') {
        state.introReveal = 0;
        introComet.headMat.opacity = 0;
        for (let i = 0; i < introComet.trail.length; i++) introComet.trail[i].m.opacity = 0;
      } else if (state.introStage === 'LIGHTING') {
        const introDur = 3.2;
        const p = Math.min((elapsed - state.introStartTime) / introDur, 1.0);
        // Smooth ease-in-out curve for comet spiral ascent
        const eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        state.introReveal = eased * 1.15;

        // Position shooting-star comet & its 18-point spiral trail
        const cometT = Math.min(eased / 0.88, 1.0);
        const cometFade = p < 0.85 ? 1.0 : Math.max(0, 1.0 - (p - 0.85) / 0.15);
        const cY = -6.5 + cometT * 13.45;
        const cR = 5.35 * Math.pow(Math.max(0, 1.0 - cometT), 0.92) + 0.25;
        const cA = cometT * Math.PI * 2 * 4.5;
        introComet.head.position.set(Math.cos(cA) * cR, cY, Math.sin(cA) * cR);
        introComet.headMat.opacity = cometFade;

        for (let i = 0; i < introComet.trail.length; i++) {
          const tt = Math.max(0, cometT - (i + 1) * 0.011);
          const ty = -6.5 + tt * 13.45;
          const tr = 5.35 * Math.pow(Math.max(0, 1.0 - tt), 0.92) + 0.25;
          const ta = tt * Math.PI * 2 * 4.5;
          introComet.trail[i].sp.position.set(Math.cos(ta) * tr, ty, Math.sin(ta) * tr);
          introComet.trail[i].m.opacity = cometFade * (1 - i / introComet.trail.length) * 0.72;
        }

        // Apex star ignition flash when comet reaches top
        if (p >= 0.80) {
          starFlashBoost = Math.sin(((p - 0.80) / 0.20) * Math.PI) * 1.4;
        }
        if (p >= 0.70) titleXmasEl.classList.add('revealed');
        if (p >= 0.92) controlDockEl.classList.add('revealed');

        if (p >= 1.0) {
          state.introStage = 'DONE';
          state.introReveal = 1.25;
          introComet.headMat.opacity = 0;
          for (let i = 0; i < introComet.trail.length; i++) introComet.trail[i].m.opacity = 0;
          titleXmasEl.classList.add('revealed');
          controlDockEl.classList.add('revealed');
          setTimeout(() => {
            showToast(
              isMobile
                ? '✨ 单指旋转 · 双指放大自动散开 · 散开后单击看拍立得'
                : '✨ 拖拽旋转 · 滚轮/Space 散开星云 · 单击查看拍立得',
              3400
            );
          }, 500);
        }
      } else {
        state.introReveal = 1.25;
      }

      const focusDimTarget = state.activePhotoIndex !== -1 ? 0.52 : 1.0;
      particleTree.mat.uniforms.uDim.value = THREE.MathUtils.lerp(
        particleTree.mat.uniforms.uDim.value,
        focusDimTarget,
        camLerp
      );
      particleTree.mat.uniforms.uTime.value = elapsed;
      particleTree.mat.uniforms.uScatter.value = state.scatterCurrent;
      particleTree.mat.uniforms.uTheme.value = state.themeCurrent;
      particleTree.mat.uniforms.uReveal.value = state.introReveal;

      // Update flowing spiral light ribbons, star-ring pedestal & falling snow
      const dimVal = particleTree.mat.uniforms.uDim.value;
      for (let i = 0; i < spiralRibbons.length; i++) {
        const rb = spiralRibbons[i];
        rb.mat.uniforms.uTime.value = elapsed;
        rb.mat.uniforms.uScatter.value = state.scatterCurrent;
        rb.mat.uniforms.uDim.value = dimVal;
        rb.mat.uniforms.uReveal.value = state.introReveal;
        rb.mesh.scale.setScalar(1.0 + state.scatterCurrent * 0.55);
      }

      const baseReveal = THREE.MathUtils.clamp(state.introReveal * 4.5, 0, 1);
      const auraVis = Math.max(0, 1.0 - state.scatterCurrent * 1.25) * dimVal * baseReveal;
      baseAura.floorMat.opacity = 0.32 * auraVis;
      baseAura.ringMat.uniforms.uTime.value = elapsed;
      baseAura.ringMat.uniforms.uOpacity.value = auraVis;
      baseAura.ringPoints.rotation.y = -elapsed * 0.24;
      baseAura.group.scale.setScalar((0.65 + 0.35 * baseReveal) + state.scatterCurrent * 0.45);

      fallingSnow.mat.uniforms.uTime.value = elapsed;

      const starReveal = THREE.MathUtils.smoothstep(state.introReveal, 0.88, 1.04);
      starTopper.group.position.lerpVectors(starTopper.homePos, starTopper.scatterPos, state.scatterCurrent);
      starTopper.group.scale.setScalar(Math.max(0.0001, starReveal * (1.0 + starFlashBoost * 0.22)));
      starTopper.group.visible = starReveal > 0.01;
      starTopper.starMesh.rotation.y = elapsed * 0.85;
      starTopper.starMat.color.lerpColors(xmasStarColor, cnyStarColor, state.themeCurrent);
      starTopper.starMat.emissiveIntensity = 1.25 + 0.25 * Math.sin(elapsed * 3.0) + starFlashBoost;
      const starPulse = 1.0 + 0.06 * Math.sin(elapsed * 2.4);
      starTopper.flareSprite.scale.setScalar((2.65 + starFlashBoost * 1.6) * starPulse);
      starTopper.rayGroup.rotation.z = elapsed * 0.35;
      starTopper.rayMat.opacity = 0;

      const swirlSin = Math.sin(state.scatterCurrent * Math.PI);
      for (let i = 0; i < ornaments.length; i++) {
        const o = ornaments[i];
        const normY = THREE.MathUtils.clamp((o.homePos.y + 6.75) / 13.4, 0, 1);
        const ornRev = THREE.MathUtils.smoothstep(state.introReveal, normY - 0.04, normY + 0.06);
        o.mesh.visible = ornRev > 0.01;
        if (!o.mesh.visible) continue;

        if (o.isGift && o.homePos.y < -5.8) {
          o.mesh.scale.set(o.baseScale * 1.05 * ornRev, o.baseScale * 0.88 * ornRev, o.baseScale * 1.05 * ornRev);
        } else {
          o.mesh.scale.setScalar(o.baseScale * ornRev);
        }

        tmpVec.lerpVectors(o.homePos, o.scatterPos, state.scatterCurrent);

        const swirlAngle = swirlSin * (2.4 + o.homePos.y * 0.14);
        const ca = Math.cos(swirlAngle);
        const sa = Math.sin(swirlAngle);
        const rx = tmpVec.x * ca - tmpVec.z * sa;
        const rz = tmpVec.x * sa + tmpVec.z * ca;
        tmpVec.x = rx;
        tmpVec.z = rz;

        tmpVec.y += Math.sin(elapsed * 1.4 + o.phase) * THREE.MathUtils.lerp(0.05, 0.36, state.scatterCurrent);
        o.mesh.position.copy(tmpVec);

        o.mat.color.lerpColors(o.xCol, o.cCol, state.themeCurrent);
        o.mat.emissive.copy(o.mat.color);
        o.mat.emissiveIntensity = (o.isGift ? 0.26 : 0.34) + 0.12 * Math.sin(elapsed * 2.2 + o.phase);

        if (o.bandMat) {
          o.bandMat.opacity = state.themeCurrent * 0.88;
        }
        if (o.isGift) {
          o.mesh.rotation.y += dt * 0.45;
          o.mesh.rotation.x += dt * 0.15 * state.scatterCurrent;
        }
      }

      // Polaroid Cards — Portrait-aware framing so card fits iPhone width perfectly
      camera.getWorldDirection(camForward);
      const focusDist = isPortrait() ? 10.6 : 8.6;
      const focusScale = isPortrait() ? 0.96 : 1.08;
      const focusPos = camera.position.clone().addScaledVector(camForward, focusDist);
      const photoLerp = 1 - Math.exp(-5.8 * dt);

      for (let i = 0; i < polaroidCards.length; i++) {
        const card = polaroidCards[i];
        const isFocused = i === state.activePhotoIndex;

        if (isFocused) {
          const targetPos = focusPos.clone();
          targetPos.y += (isPortrait() ? 0.35 : 0.0) + Math.sin(elapsed * 1.6) * 0.07;
          card.group.position.lerp(targetPos, photoLerp);

          tmpQuat.copy(camera.quaternion);
          const tilt = new THREE.Quaternion().setFromEuler(
            new THREE.Euler(Math.sin(elapsed * 1.1) * 0.03, Math.cos(elapsed * 0.9) * 0.04, Math.sin(elapsed * 0.8) * 0.02)
          );
          tmpQuat.multiply(tilt);
          card.group.quaternion.slerp(tmpQuat, photoLerp);

          const s = THREE.MathUtils.lerp(card.group.scale.x, focusScale, photoLerp);
          card.group.scale.setScalar(s);
          card.glowMat.opacity = THREE.MathUtils.lerp(card.glowMat.opacity, 0.65, photoLerp);
        } else {
          tmpVec.lerpVectors(card.treeHome, card.nebulaHome, state.scatterCurrent);
          tmpVec.y += Math.sin(elapsed * 0.9 + card.phase) * 0.45;
          tmpVec.x += Math.cos(elapsed * 0.7 + card.phase) * 0.35;
          card.group.position.lerp(tmpVec, photoLerp * 0.75);

          const targetScale = THREE.MathUtils.lerp(0.11, 0.24, state.scatterCurrent) * THREE.MathUtils.clamp(state.introReveal, 0, 1);
          const s = THREE.MathUtils.lerp(card.group.scale.x, targetScale, photoLerp);
          card.group.scale.setScalar(s);
          card.group.visible = s > 0.005;

          const idleQuat = new THREE.Quaternion().setFromEuler(
            new THREE.Euler(
              card.rotSeed.x + Math.sin(elapsed * 0.5 + card.phase) * 0.15,
              card.rotSeed.y + elapsed * 0.25,
              card.rotSeed.z
            )
          );
          card.group.quaternion.slerp(idleQuat, photoLerp * 0.5);
          card.glowMat.opacity = THREE.MathUtils.lerp(card.glowMat.opacity, 0.28 * state.scatterCurrent, photoLerp);
        }
      }

      composer.render();
    }

    animate();

    /* =========================================================================
       12. RESPONSIVE RESIZE / ORIENTATION HANDLER
       ========================================================================= */
    function handleResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.fov = isPortrait() ? 52 : 46;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloomPass.setSize(w, h);
    }

    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', () => setTimeout(handleResize, 250));
  </script>
</body>
